risk: medium
risk_reasons:
  - Shared prerequisites must stay running when a dependent fails to stop.
  - Dashboard confirmation must authorize only the targets shown to the user.
implementation:
  - Reverse dependency ordering with reverse config priority among ready independent targets.
  - Confirm stops before continuing; failures protect all transitive prerequisites and prevent eject.
  - Preserve the legacy system pass only without an explicit container-system target.
  - Mixed depends_on and stop_system configs order targets first, then use the unchanged legacy pass.
  - Record the approved mixed-mode clarification in spec sections 3.4 and 3.6.
  - Dashboard dependency labels, asynchronous read-only plans and existing pending confirmations.
  - Reject changed dependency sets before executing a confirmed dashboard action.
  - One deprecation line per stop_system target in list and status.
  - Correct singular and plural dependent notices.
  - Update README, example config and emulator recipe for explicit shared-system dependencies.
