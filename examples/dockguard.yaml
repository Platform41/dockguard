# Example DockGuard config. Copy it to ~/.config/dockguard/dockguard.yaml and set your paths.
# This file is the record of which applications DockGuard manages on the external drive.

drive: /Volumes/ExternalSSD
minimum_free_space_gb: 50        # default for every target

targets:
  docker:
    kind: docker-desktop
    storage_path: /Volumes/ExternalSSD/docker-data/DockerDesktop
    # settings_path: ~/Library/Application Support/Docker/settings-store.json   # auto-detected if omitted
    require_cli_start_support: true
    fail_if_already_running: true
    # minimum_free_space_gb: 100  # per-target override

  xcode:
    kind: app
    app: Xcode                     # the name `open -a` takes
    symlink_paths:                 # internal-disk paths linked onto the drive
      - ~/Library/Developer/Xcode/DerivedData
    # Never list ~/Library/Developer/CoreSimulator/Devices: simulators break on an external drive.

  myapp-db:
    kind: postgres                 # a cluster run with pg_ctl, not brew services
    data_dir: /Volumes/ExternalSSD/pgdata/myapp
    bin_dir: /opt/homebrew/opt/postgresql@17/bin   # required: the cluster's own version
    port: 55432                    # optional
    socket_dir: /tmp               # optional
    log_file: /Volumes/ExternalSSD/pgdata/myapp.log   # optional

# Planned kind (docs/specs/multi-target.md): container in v0.4.0.
