# Example DockGuard config. Copy it to ~/.config/dockguard/dockguard.yaml and set your paths.
# This file is the record of which applications DockGuard manages on the external drive.

drive: /Volumes/ExternalSSD
minimum_free_space_gb: 50        # default for every target

targets:
  docker:
    kind: docker-desktop
    storage_path: /Volumes/ExternalSSD/docker-data/DockerDesktop
    # settings_path: ~/Library/Application Support/Docker/settings-store.json   # auto-detected if omitted
    require_cli_start_support: true
    fail_if_already_running: true
    # minimum_free_space_gb: 100  # per-target override

# Planned kinds (docs/specs/multi-target.md): app and postgres in v0.3.0, container in v0.4.0.
